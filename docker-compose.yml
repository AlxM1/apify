services:
  apify:
    build: .
    container_name: apify-scraper
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data          # Persist SQLite database
      - ./.env:/app/.env:ro       # Mount config
      - ./proxies.txt:/app/proxies.txt:ro  # Optional proxy list
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/dashboard')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
